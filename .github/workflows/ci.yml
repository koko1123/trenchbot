name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test -v -race -count=1 ./internal/filter/ ./internal/risk/ ./internal/state/ ./internal/monitor/

  simulation:
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run paper trading simulation
        run: go test -v -race -timeout 5m ./internal/simulation/
      - name: Upload simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-report
          path: simulation-report.json
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: [simulation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build -o trenchbot ./cmd/sniper
